name: Release

# Pushing a version tag (v2.101 and so on) publishes that version's fonts as a GitHub release.
# The releases are where the fonts are downloaded from: the site does not host them.
on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Tools
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q ttfautohint
          python -m venv .venv && .venv/bin/python -m pip install -q -r requirements.txt
      - name: The tagged fonts pass the release checks and carry the tag's version
        run: |
          make test
          version=$(cd scripts && ../.venv/bin/python -c 'from build2 import VERSION; print(VERSION)')
          test "v$version" = "$GITHUB_REF_NAME"
      - name: The release ZIPs
        run: .venv/bin/python scripts/package.py
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # the notes are this version's FONTLOG entry
          awk '/^ChangeLog/ {on = 1; next} on && /^[0-9]+\.[0-9]+ \(/ {n++} n == 1' FONTLOG.txt > notes.md
          gh release create "$GITHUB_REF_NAME" build/dist/*.zip --title "Four Irish Typefaces $GITHUB_REF_NAME" --notes-file notes.md
